<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Despistaje de Anemia</title>
    <!-- Early theme read: explicit localStorage choice first, OS signal
         otherwise — same resolution as getInitialTheme(). Runs before the
         bundle so first paint already carries .dark (no flash). -->
    <script>
      try {
        var t = localStorage.getItem("theme-mode");
        if (
          t === "dark" ||
          (t !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
